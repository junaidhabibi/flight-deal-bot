name: Flight deal scan

# This is what keeps the bot running when your laptop is off: GitHub runs it
# on their servers, on a schedule, forever. Nothing runs on your machine.
#
# COST: on a PUBLIC repo, Actions minutes are unlimited and free -- raise the
# frequency as high as you like. On a PRIVATE repo you get 2,000 minutes a
# month, and GitHub rounds every run up to a whole minute. At ~4 minutes of
# work plus runner startup, each run bills about 5 minutes:
#
#     every 3 hours  ->  9 runs/day  ->  ~1,350 min/month   (safe, the default)
#     every 2 hours  -> 13 runs/day  ->  ~1,950 min/month   (too close to 2,000)
#     every 1 hour   -> 25 runs/day  ->  ~3,750 min/month   (public repo only)
#
# The scan rotates through routes, so every 3 hours still covers the whole
# route list roughly twice a day and watches Stockholm on every single run.

on:
  schedule:
    # Every 3 hours. Safe on a private repo's free tier.
    - cron: "15 */4 * * *"
    # Daily digest at 12:00 UTC = 7am Central (CDT) / 6am (CST).
    - cron: "0 12 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print emails instead of sending"
        type: boolean
        default: false
      digest:
        description: "Force the digest email"
        type: boolean
        default: false

# Never let two runs write the price history at once.
concurrency:
  group: flight-scan
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    # A rotating scan is ~4 minutes. 15 is a generous ceiling that still
    # stops a hung run from eating the month's quota.
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m tests.test_bot

      - name: Check required secrets are set
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
        run: |
          # SERPAPI_KEY is the only fare source. SMTP_* is how anything
          # reaches you. ALERT_EMAIL is checked too: without it the code
          # silently falls back to SMTP_USER, so a typo quietly redirects
          # every alert to the sending account instead of failing.
          missing=""
          [ -z "$SERPAPI_KEY" ] && missing="$missing SERPAPI_KEY"
          [ -z "$SMTP_USER" ] && missing="$missing SMTP_USER"
          [ -z "$SMTP_PASS" ] && missing="$missing SMTP_PASS"
          [ -z "$ALERT_EMAIL" ] && missing="$missing ALERT_EMAIL"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing"
            echo "Add them under Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          echo "All required secrets present."

      - name: Scan for deals
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          # The 12:00 UTC schedule is the digest run.
          if [ "${{ github.event.schedule }}" = "0 12 * * *" ] || \
             [ "${{ github.event.inputs.digest }}" = "true" ]; then
            ARGS="$ARGS --digest"
          fi
          python -m bot.main $ARGS

      - name: Show what the bot has learned
        if: always()
        run: python -m bot.main --stats || true

      - name: Commit the price history
        if: always()
        run: |
          git config user.name  "flight-deal-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -f data/prices.db
          if git diff --staged --quiet; then
            echo "No history changes."
          else
            git commit -m "Price history: $(date -u '+%Y-%m-%d %H:%M UTC')"
            # Another run may have pushed while this one was scanning.
            #
            # This loop used to end with `sleep 5`, so when all three
            # attempts failed its exit status was sleep's -- zero. The step
            # went green while the run's ENTIRE price history (every
            # observation, every alert row, every API-usage counter) was
            # discarded with the ephemeral runner, and the next run
            # re-spent API calls it had already paid for.
            #
            # prices.db is a binary SQLite file, so a concurrent change
            # cannot auto-merge. A failed rebase must be aborted or every
            # later attempt dies with "rebase in progress". Ours is the
            # newer data, so on conflict we keep it.
            pushed=0
            for i in 1 2 3; do
              if git pull --rebase --autostash; then
                :
              else
                echo "Rebase hit a conflict (attempt $i) -- keeping our copy."
                git checkout --ours data/prices.db 2>/dev/null || true
                git add data/prices.db 2>/dev/null || true
                git rebase --continue 2>/dev/null || git rebase --abort || true
              fi
              if git push; then
                pushed=1
                break
              fi
              echo "Push attempt $i failed, retrying..."
              sleep 5
            done
            if [ "$pushed" -ne 1 ]; then
              echo "::error::Could not push the price history after 3 tries."
              echo "This run's observations are lost. The next run starts"
              echo "from the last committed database."
              exit 1
            fi
            echo "Price history pushed."
          fi
