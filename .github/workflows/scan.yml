name: Flight deal scan

# This is what keeps the bot running when your laptop is off: GitHub runs it
# on their servers, on a schedule, forever. Nothing runs on your machine.
#
# COST: on a PUBLIC repo, Actions minutes are unlimited and free -- raise the
# frequency as high as you like. On a PRIVATE repo you get 2,000 minutes a
# month, and GitHub rounds every run up to a whole minute. At ~4 minutes of
# work plus runner startup, each run bills about 5 minutes:
#
#     every 3 hours  ->  9 runs/day  ->  ~1,350 min/month   (safe, the default)
#     every 2 hours  -> 13 runs/day  ->  ~1,950 min/month   (too close to 2,000)
#     every 1 hour   -> 25 runs/day  ->  ~3,750 min/month   (public repo only)
#
# Cadence is set by the SerpApi free tier, not by GitHub. Each run spends one
# search on a sweep of DFW -> all of Europe. The tier is 250/month and has to
# cover verification too, so the budget is sized for SIX runs a day.

on:
  schedule:
    # Five scans, plus the digest run below = 6 runs/day.
    #
    # This was "15 */4 * * *", which is SIX firings (00:15 ... 20:15) and
    # with the 12:00 digest made SEVEN runs a day against a budget sized for
    # six. The daily cap then silently skipped about one sweep every day,
    # logged only as a warning -- and if the skipped run was the digest one,
    # there was no digest at all that day. Dropping 12:15 lets the digest
    # run do double duty.
    - cron: "15 0,4,8,16,20 * * *"
    # Daily digest at 12:00 UTC = 7am Central (CDT) / 6am (CST).
    - cron: "0 12 * * *"
    # Weekly "still alive" email, Sundays 13:00 UTC = 8am Central.
    #
    # This is the ONLY thing that catches the bot not running at all --
    # GitHub disabling the schedule after 60 days, Actions switched off, the
    # workflow file broken, the repo archived. No check inside the bot can
    # fire when the bot isn't running, so the signal has to be a routine
    # message whose ABSENCE is noticeable.
    - cron: "0 13 * * 0"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print emails instead of sending"
        type: boolean
        default: false
      digest:
        description: "Force the digest email"
        type: boolean
        default: false

# Never let two runs write the price history at once.
concurrency:
  group: flight-scan
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scan:
    # PINNED, not ubuntu-latest. GitHub announced that ubuntu-latest
    # migrates to Ubuntu 26 on 2026-10-19 -- a month from now, and it would
    # happen to an unattended bot with nobody watching. A pinned image means
    # the OS changes when this file changes, not on GitHub's calendar.
    # Revisit when 24.04 nears end of support.
    runs-on: ubuntu-24.04
    # A rotating scan is ~4 minutes. 15 is a generous ceiling that still
    # stops a hung run from eating the month's quota.
    timeout-minutes: 15

    steps:
      # checkout@v4 and setup-python@v5 target Node 20, which GitHub has
      # deprecated -- runs were already being force-migrated to Node 24 with
      # a warning on every single run. v5/v6 target Node 24 natively.
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        id: tests
        # A scheduled scan runs code that has not changed since the previous
        # scan, so a red suite there is almost always the environment, not
        # the bot -- and on 2026-09-22 that cost a whole run: one assertion
        # failed, every later step was skipped, and the bot was blind for
        # four hours over a bug that could not affect a single fare.
        #
        # Tests still BLOCK a push or a manual run, which is when the code
        # actually changed and shipping it broken could mail wrong prices.
        # On a schedule they report instead of gagging the bot: the scan
        # goes ahead, and the job is failed at the very end so GitHub still
        # emails about it. Reporting, not silence -- and not blindness.
        continue-on-error: ${{ github.event_name == 'schedule' }}
        run: python -m tests.test_bot

      - name: Check required secrets are set
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
        run: |
          # SERPAPI_KEY is the only fare source. SMTP_* is how anything
          # reaches you. ALERT_EMAIL is checked too: without it the code
          # silently falls back to SMTP_USER, so a typo quietly redirects
          # every alert to the sending account instead of failing.
          missing=""
          [ -z "$SERPAPI_KEY" ] && missing="$missing SERPAPI_KEY"
          [ -z "$SMTP_USER" ] && missing="$missing SMTP_USER"
          [ -z "$SMTP_PASS" ] && missing="$missing SMTP_PASS"
          [ -z "$ALERT_EMAIL" ] && missing="$missing ALERT_EMAIL"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing"
            echo "Add them under Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          echo "All required secrets present."

      - name: Scan for deals
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          # Sunday 13:00 UTC is the weekly heartbeat: send it and stop.
          HOUR=$(date -u +%H)
          DOW=$(date -u +%u)          # 7 = Sunday
          if [ "$HOUR" = "13" ] && [ "$DOW" = "7" ]; then
            python -m bot.main --heartbeat
            exit $?
          fi

          # The 12:00 UTC run is the digest. Matched on the HOUR, not on the
          # literal cron string: comparing against "0 12 * * *" meant any
          # later edit to that line -- even whitespace -- would silently
          # disable the digest forever, with no error anywhere.
          if [ "$HOUR" = "12" ] || [ "${{ github.event.inputs.digest }}" = "true" ]; then
            ARGS="$ARGS --digest"
          fi
          python -m bot.main $ARGS

      - name: Show what the bot has learned
        if: always()
        run: python -m bot.main --stats || true

      - name: Commit the price history
        if: always()
        run: |
          git config user.name  "flight-deal-bot"
          git config user.email "bot@users.noreply.github.com"
          # Never commit a database that is already broken. The job has a
          # 15-minute timeout and this step runs with if: always(), so a
          # cancelled run can reach here mid-transaction -- and the rollback
          # journal is not committed alongside the file. Committing that
          # produces a permanently corrupt DB in the repo, which then makes
          # every future run die in History.__init__ with no email and no
          # recovery path.
          if ! python -c "
          import sqlite3, sys
          c = sqlite3.connect('data/prices.db')
          r = c.execute('PRAGMA integrity_check').fetchone()[0]
          sys.exit(0 if r == 'ok' else 1)
          "; then
            echo "::error::data/prices.db failed its integrity check — not committing it."
            echo "The last good copy stays in the repo; the next run will use that."
            exit 1
          fi
          git add -f data/prices.db
          if git diff --staged --quiet; then
            echo "No history changes."
          else
            git commit -m "Price history: $(date -u '+%Y-%m-%d %H:%M UTC')"
            # Another run may have pushed while this one was scanning.
            #
            # This loop used to end with `sleep 5`, so when all three
            # attempts failed its exit status was sleep's -- zero. The step
            # went green while the run's ENTIRE price history (every
            # observation, every alert row, every API-usage counter) was
            # discarded with the ephemeral runner, and the next run
            # re-spent API calls it had already paid for.
            #
            # prices.db is a binary SQLite file, so a concurrent change
            # cannot auto-merge. A failed rebase must be aborted or every
            # later attempt dies with "rebase in progress". Ours is the
            # newer data, so on conflict we keep it.
            pushed=0
            for i in 1 2 3; do
              if git pull --rebase --autostash; then
                :
              else
                echo "Rebase hit a conflict (attempt $i) -- keeping our copy."
                git checkout --ours data/prices.db 2>/dev/null || true
                git add data/prices.db 2>/dev/null || true
                git rebase --continue 2>/dev/null || git rebase --abort || true
              fi
              if git push; then
                pushed=1
                break
              fi
              echo "Push attempt $i failed, retrying..."
              sleep 5
            done
            if [ "$pushed" -ne 1 ]; then
              echo "::error::Could not push the price history after 3 tries."
              echo "This run's observations are lost. The next run starts"
              echo "from the last committed database."
              exit 1
            fi
            echo "Price history pushed."
          fi

      - name: Fail the run if the suite was red
        # Last, deliberately. A scheduled run with failing tests still
        # scans and still commits its price history above; this only makes
        # the job end red, which is the thing that reaches an inbox.
        if: ${{ always() && steps.tests.outcome == 'failure' }}
        run: |
          echo "::error::Tests failed. The scan was allowed to continue"
          echo "because the code has not changed since the last green run,"
          echo "but read the 'Run tests' step above -- something is wrong."
          exit 1
