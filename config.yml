# ---------- Stopover cities you'd happily spend a day or two in ----------
# The bot stitches ORIGIN -> HUB -> DESTINATION and *requires* the gap between
# the two flights to fall inside layover_hours below. Nothing shorter gets
# through, so you never get a 90-minute connection.
stopover_hubs:
  - {code: KEF, city: "Reykjavik",  country: "Iceland",     appeal: 1.30}
  - {code: HEL, city: "Helsinki",   country: "Finland",     appeal: 1.25}
  - {code: CPH, city: "Copenhagen", country: "Denmark",     appeal: 1.25}
  - {code: DUB, city: "Dublin",     country: "Ireland",     appeal: 1.20}
  - {code: LIS, city: "Lisbon",     country: "Portugal",    appeal: 1.20}
  - {code: AMS, city: "Amsterdam",  country: "Netherlands", appeal: 1.15}
  - {code: IST, city: "Istanbul",   country: "Turkey",      appeal: 1.15}
  - {code: LHR, city: "London",     country: "UK",          appeal: 1.10}
  - {code: CDG, city: "Paris",      country: "France",      appeal: 1.10}
  - {code: MAD, city: "Madrid",     country: "Spain",       appeal: 1.10}
  - {code: BCN, city: "Barcelona",  country: "Spain",       appeal: 1.10}
  - {code: OSL, city: "Oslo",       country: "Norway",      appeal: 1.05}
  - {code: FRA, city: "Frankfurt",  country: "Germany",     appeal: 0.95}
  - {code: MUC, city: "Munich",     country: "Germany",     appeal: 1.00}
  - {code: ZRH, city: "Zurich",     country: "Switzerland", appeal: 1.00}
  - {code: VIE, city: "Vienna",     country: "Austria",     appeal: 1.05}
  - {code: BRU, city: "Brussels",   country: "Belgium",     appeal: 1.00}
  - {code: WAW, city: "Warsaw",     country: "Poland",      appeal: 1.00}

# ---------- Trip shape ----------
trip:
  # How far ahead to scan. Dates are open/flexible, so this is wide.
  search_months_ahead: 11
  search_months_start: 1          # skip the next 30 days (fares are never good)

  # Nights at the final destination (excludes stopover time).
  min_nights: 5
  max_nights: 21

  # THE LAYOVER RULE. Two acceptable shapes, with a gap between them:
  #
  #   0 - 5h      QUICK      a normal connection. Fine.
  #   5 - 14h     DEAD ZONE  rejected. Too long to sit in a terminal, too
  #                          short to be worth a hotel and seeing anything.
  #   14 - 24h    DEPENDS    a stopover only if it actually spans a night.
  #                          18:00 -> 08:00 is a hotel, a dinner and a
  #                          morning. 08:00 -> 22:00 is the same 14 hours
  #                          spent dragging a suitcase around. Same number,
  #                          completely different trip -- so the clock times
  #                          decide, not the duration.
  #   24 - 120h   STOPOVER   a real stay. Sleep there, see the city, fly on.
  #   over 120h              that's two trips, not a stopover.
  #
  # The dead zone is the point of this. A 9-hour layover in Frankfurt is the
  # worst thing a cheap fare can hide, and price-sorted search hands them out
  # constantly.
  layover:
    quick_max_hours: 5        # a connection this short needs no overnight
    overnight_min_hours: 14   # shortest gap that can count as a night
    overnight_max_hours: 120  # 5 days max in the stopover city

    # Under this many hours, the gap must cover the quiet hours below to
    # count as an overnight. Above it, a night is guaranteed regardless.
    require_night_below_hours: 24
    night_core_start: 1       # 01:00 local, at the STOPOVER city
    night_core_end: 6         # 06:00 local

    # Fares from the API report a total journey time but never the layover
    # inside it. The bot estimates it (total duration minus how long the
    # flying should take) and drops fares that land clearly in the dead zone.
    # How much clearance past the 5h line an ESTIMATE needs before the bot
    # will throw a fare away.
    #
    # Raised 2.5 -> 7.0 on 2026-09-19 after measuring it. The estimate is
    # total journey time minus expected flying time, where "expected" comes
    # from the great-circle line between origin and destination. A hub off
    # that line adds real flying time, and the estimate blames all of it on
    # the layover. Measured detours:
    #     DFW-HEL-ARN   +0.8h      DFW-CDG-ARN  +1.6h
    #     DFW-LHR-ARN   +1.2h      DFW-IST-ARN  +5.0h
    # So a Turkish routing with a genuine 45-minute connection estimates at
    # 6.0h, and with a 3h connection at 8.3h -- arithmetically identical to
    # a direct routing with a 7h wait. No threshold separates them, because
    # the two cases produce the same number. Turkish fares were in the live
    # sweep, so this is not hypothetical.
    #
    # Which error to prefer is the real question, and it isn't symmetric:
    # a fare dropped on a bad estimate is INVISIBLE -- it never appears in
    # any email and nothing records that it was considered. A fare wrongly
    # kept arrives clearly flagged ("Possible long layover (~8.3h)"), where
    # it can be checked in one click. So the bot now only discards a fare
    # when the estimate is past 12h, which no transatlantic detour explains.
    # Everything between 5h and 12h arrives with the estimate attached.
    #
    # Note this applies ONLY to estimated layovers. A stopover the bot built
    # itself has real departure and arrival times, and the two-band rule is
    # still enforced exactly on those.
    estimate_margin_hours: 7.0
    reject_estimated_dead_zone: true

  # Reject itineraries with more connections than this (per direction),
  # not counting the intentional long stopover.
  max_extra_stops: 1

  cabin: economy
  passengers: 1
  currency: USD

# ---------- Your carry-on ----------
# Samsonite Freeform Carry-On Spinner. Dimensions are the OVERALL figures
# from Samsonite (23" H x 15" L x 10" W), which is what airlines measure --
# their sizers include wheels and handles.
#
# The bag is over the PUBLISHED limit everywhere (58.4 x 38.1 x 25.4 cm vs a
# 55x40x23 European standard), but published limits are not what happens at
# the gate. The bot rates risk by ENFORCEMENT, from traveler reports:
#
#   AA / DL / UA          lenient   -> low risk, matches real-world experience
#   British Airways, KLM  lenient   -> low risk
#   Finnair, Lufthansa    lenient on size, but weigh sometimes
#   SAS                   weighs bags routinely, even in SAS Plus
#   Ryanair, Eurowings,   sizer at every gate
#   Wizz, Aer Lingus
#
# The practical conclusion: SIZE is rarely the problem on a transatlantic
# leg. WEIGHT on Nordic carriers, and the strict low-cost airlines that fly
# the intra-Europe stopover hops, are where this bag actually gets caught.
# See `python -m bot.main --bag` for the current table.
carry_on:
  name: "Samsonite Freeform Carry-On Spinner"
  # Overall external dimensions, inches, including wheels and handle.
  height_in: 23
  width_in: 15
  depth_in: 10
  weight_lb: 6.5
  expandable_in: 1        # never expand it at the gate

  # Roughly what you pack, in lb (contents only, bag excluded). This is what
  # drives the weight-risk warnings. Set to null to skip weight checks.
  # 15 lb packed + 6.5 lb bag = 9.8 kg, over Finnair/SAS's 8 kg cabin cap.
  packed_weight_lb: 15

  # Fare estimate to add a cabin bag when the cheapest fare excludes one.
  # Used for airlines not in bot/baggage.py's table.
  assume_fee_usd: 45

  # Override the built-in per-airline estimates as you learn real numbers.
  # Keys are IATA airline codes.
  fee_overrides: {}
    # AY: 55          # Finnair
    # SK: 40          # SAS

  # Force "cheapest fare includes a cabin bag" true/false for an airline.
  included_overrides: {}
    # AY: false

# ---------- What counts as "heavily discounted" ----------
# The bot computes a discount vs. the lowest credible reference price it has.
# You said you mean it, so the floor is deliberately aggressive.
thresholds:
  # Absolute hard ceiling. Nothing above this is ever emailed, full stop.
  # NOTE: all prices below are ALL-IN -- fare plus carry-on fees. On a
  # separate-ticket stopover that means a bag fee per ticket, which is
  # exactly the cost that makes a cheap-looking stopover not cheap.
  # Set by Junaid 2026-09-19: "deal-shaped, not bargain-only". The most he'd
  # actually pay for a European round trip, all-in with the carry-on.
  #
  # History: this was 499, which was 18% BELOW the cheapest DFW->ARN fare
  # available anywhere in the next six months. Combined with the old 35%
  # discount gate the bot could only ever have fired at $422 -- i.e. never.
  #
  # At 625 this ceiling binds on only three destinations (Helsinki, Reykjavik,
  # London), whose floors are $728-789 and which therefore only reach the inbox
  # in a real sale. Everywhere else the discount tiers below decide.
  max_price_usd: 625

  # Drop fares outright when the bag is badly oversize for that carrier
  # (>2cm over). Off by default: you may be happy to gate-check for a
  # $250 fare. Turn on if you never want to risk it.
  skip_oversize_bag_routes: false

  # Day one, the bot has no price history, so nothing can be a "record" and
  # require_record below would drop everything. This is the escape hatch: a
  # fare at this tier or better alerts anyway, on the strength of its
  # discount alone, while history is still being built.
  #
  # Was effectively "insane" (45% off, $358 to Stockholm) until 2026-09-19,
  # when a rehearsal showed a genuine 28%-off Stockholm fare being dropped
  # for having no history to beat. "great" is 32% off -- rare enough not to
  # be noise, reachable enough to actually fire.
  # The origin every baseline_usd above was measured from. A fare from any
  # OTHER origin gets no baseline and must build its own price history first.
  #
  # Added 2026-09-19 after the first live run scored a routine ORD->Reykjavik
  # fare at "40% off" by measuring it against a Dallas baseline. Chicago has
  # an Icelandair nonstop; Dallas doesn't. $393 is Chicago's ordinary winter
  # price -- identical on two different weeks -- not a deal.
  baseline_origin: DFW

  no_history_alert_tier: great

  # Minimum discount vs. the route's reference price, to alert at all.
  # Recalibrated 2026-09-19. Observed reality: DFW->ARN bottoms out at $608
  # against a $650 baseline -- only 6% below it. A 35% gate ($422) is not a
  # "rare deal", it is an impossibility. 18% ($533 for ARN) is roughly 14%
  # under the six-month floor: rare, but a real sale or error fare reaches it.
  min_discount_pct: 18

  # Tier boundaries (discount % vs reference price).
  # What each tier means in dollars for Stockholm (baseline $650):
  #   watch  18% -> $533   logged only
  #   good   25% -> $488   daily digest
  #   great  32% -> $442   instant email
  #   insane 45% -> $358   instant email, flagged as probable error fare
  # For reference, the cheapest ARN fare on sale anywhere Oct'26-Mar'27 is $608.
  tiers:
    watch:    18      # logged, not emailed on its own
    good:     25      # emailed in the daily digest
    great:    32      # emailed immediately
    insane:   45      # emailed immediately, flagged as probable error fare

  # Only email immediately for >= this tier. Everything else waits for
  # the daily digest so you aren't pinged all day.
  instant_alert_tier: great

  # A fare is a RECORD if it is at or below every price the bot has ever
  # recorded for that route. record_tolerance_pct lets a near-tie count.
  record_tolerance_pct: 2.0

  # Require a record (or near-record) before emailing, regardless of tier.
  # This is the "as low or lower than it has ever been" rule. Set false if
  # you want good-but-not-record fares too.
  require_record: true

  # Until the bot has this many observations for a route, it leans on
  # baseline_usd from the destination list instead of its own history.
  min_observations_for_history: 8

# ---------- Alerting ----------
alerts:
  # Don't re-send the same route+price within this window.
  dedupe_hours: 72
  # Don't send more than this many emails per day, no matter what.
  # If the bot records ZERO fares this many runs in a row, it emails to say
  # so. Zero on one run is normal; zero for a day means it is not seeing the
  # data at all -- an expired key, an exhausted quota, or a changed response
  # format. All of those exit 0 and show a green check, which is how a dead
  # bot looks exactly like a quiet one. 6 runs is about 24 hours.
  silence_warning_after_runs: 6

  max_emails_per_day: 6
  # Daily digest send time, local (24h). Set to null to disable the digest.
  digest_hour_local: 7
  timezone: "America/Chicago"
  # Max deals listed in one email.
  max_deals_per_email: 12

# ---------- Scan budget ----------
# A full sweep of every origin x destination x month is ~3,000 API requests
# and about 25 minutes. That's fine for the fare API (it's free), but a
# GitHub Actions private repo only gets 2,000 free minutes a month -- 13 runs
# a day at 25 minutes would burn the month's quota in under a week.
#
# So each run scans a SLICE and rotates through the rest. Your priority
# destinations get scanned every single run; everything else cycles, and
# covers the full list several times a day anyway.
#
# Note: if you make the repo PUBLIC, GitHub Actions minutes are unlimited and
# free, and you can raise these caps as high as you like.
scan:
  # Roughly how many API requests one run may make. ~120 requests/minute in
  # practice, so 600 is about a 5-minute run.
  max_requests_per_run: 600

  # Destinations at or above this priority are scanned on EVERY run, never
  # rotated out. Stockholm is 2.00, so it's always watched.
  always_scan_priority_above: 1.2

  # Origins to include in the rotating sweep. The first N are always used.
  always_scan_origins: 2

  # Share of the budget given to stopover-building (the rest goes to
  # ordinary round trips).
  stopover_budget_share: 0.45

  # Months of the search window covered per run for stopovers. Rotates.
  stopover_months_per_run: 5

# ---------- Data sources ----------
sources:
  # ---- PRIMARY FARE SOURCE ----
  # Google Travel Explore, via SerpApi. One request asks "what's cheap from
  # DFW to anywhere in Europe?" and returns ~48 destinations, each with its
  # own cheapest date pair. Verified working 2026-09-19: 48 European cities,
  # 20 of them on the list above, in a single call.
  #
  # That per-request yield is the whole design. A 250-request monthly budget
  # buys 250 route-month lookups, which is nothing; it buys 250 sweeps of an
  # entire continent, which is plenty.
  google_explore:
    enabled: true
    area_id: "/m/02j9z"          # Europe, as a Google Knowledge Graph ID
    calls_per_run: 1
    # Held back from the daily budget so verification isn't starved by the
    # sweep. See _serpapi_room in main.py.
    reserve_for_verification: 2
    # Ask the engine to price the carry-on in directly. OFF: the `bags`
    # parameter is documented but not yet verified against the live engine,
    # and a rejected request still costs a search. apply_baggage adds the
    # fee instead, which is the tested path.
    price_with_carry_on: false
    # One entry per run, cycling. Seven runs a day against a six-entry
    # cycle means the lap advances by one slot each day rather than
    # repeating -- which is fine, and spreads each origin across different
    # times of day over a week.
    # duration: 2 = about a week away, 3 = about two weeks.
    rotation:
      - {origin: DFW, duration: 2}
      - {origin: DFW, duration: 3}
      - {origin: DFW, duration: 2}
      - {origin: ORD, duration: 3}   # much cheaper to Europe; worth a look
      - {origin: DFW, duration: 3}
      - {origin: AUS, duration: 2}

  travelpayouts:
    # DISABLED 2026-09-19, after diagnosis rather than a guess.
    #
    # This endpoint does not search; it serves a cache of fares that Aviasales
    # users happened to look up in the last 48 hours. Diagnostics showed the
    # cache is simply empty for these routes: DFW->ARN returned zero fares on
    # every market, every month, one-way and round-trip, and under both the
    # airport and the city code. The control queries worked fine (JFK->LON
    # returned 13 fares), so it wasn't the token or the client. Asking DFW for
    # everything it had cached returned 30 destinations, all of them domestic.
    #
    # Left in place rather than deleted: the code is tested and costs nothing
    # while disabled, and the cache may well have depth from a different
    # origin someday. But it is not a source for Dallas to Europe.
    enabled: false
    market: us
    # Pause between calls. v3 endpoints allow 600/min; this is well under.
    request_delay_seconds: 0.15

  serpapi:
    # The verifier -- Google's own typical_price_range and price_history, as
    # a second opinion on a fare that already looks like a record.
    #
    # NOTE: this shares one key and one 250/month free tier with the Europe
    # sweep above. The budget below is the TOTAL for both.
    #
    # The schedule fires SEVEN times a day, not six: "15 */4 * * *" is six
    # runs (00:15, 04:15 ... 20:15) plus the 12:00 digest. Sized for six,
    # the daily cap silently swallowed the seventh run's sweep every day.
    #   7 runs/day x 1 sweep = 7
    #   + 2 verifications    = 9/day
    # 9 x 30 = 270, so the MONTHLY cap is the real guard and the last days
    # of a heavy month lose verifications first -- the right thing to drop,
    # since the sweep is the only fare source.
    enabled: true
    max_verifications_per_run: 2
    monthly_budget: 240        # stay under the 250 free-tier cap
    # Also capped per day, so the month's allowance can't be spent in the
    # first week. A fare worth verifying is as likely on the 28th as the 2nd.
    daily_budget: 9

  rss:
    # Human-curated error-fare feeds. Free, no key, and the fastest signal
    # for genuine mistake fares. Matched against your origins/destinations.
    enabled: true
    # Verified working 2026-09-18. The bot filters these by your origins and
    # destinations itself, so a site-wide feed is fine -- and more reliable
    # than per-city feeds.
    #
    # Note: The Flight Deal's per-city feeds (/category/flight-deals/dfw/feed/)
    # are widely recommended online but now return zero items -- the site's
    # category structure changed. Secret Flying has no working feed at all
    # (/usa-deals/feed/ redirects in a loop); subscribe to their email list
    # directly at https://www.secretflying.com/alerts/ instead.
    feeds:
      - name: "The Flight Deal"
        url: "https://www.theflightdeal.com/feed/"
      - name: "The Flight Deal - all deals"
        url: "https://www.theflightdeal.com/category/flight-deals/feed/"
    # Keywords that mark a post as worth reading even if no price parses.
    hot_keywords: ["error fare", "mistake fare", "fuel dump", "glitch"]

# ---------- Email delivery ----------
# Your address is NOT in this file, so the repo is safe to make public --
# which matters, because GitHub Actions minutes are unlimited and free on a
# public repo but capped at 2,000/month on a private one.
# Set ALERT_EMAIL as a repository secret instead. If it's unset, the bot
# falls back to SMTP_USER (i.e. it emails you at your own Gmail).
email:
  from_name: "Flight Deal Bot"
  smtp_host: "smtp.gmail.com"
  smtp_port: 587
  # Username and app password come from env vars SMTP_USER / SMTP_PASS.

# ---------- Storage ----------
storage:
  db_path: "data/prices.db"
