# ============================================================
#  Flight Deal Bot — configuration
#  Everything you'd want to tune lives in this file.
# ============================================================

# ---------- Where you fly from ----------
origins:
  # Your home airport. Listed first = preferred.
  - code: DFW
    name: "Dallas/Fort Worth"
    weight: 1.00      # no penalty
  # NOTE: Dallas Love Field (DAL) is deliberately NOT here. It has no
  # international service at all -- 98% Southwest, entirely domestic -- so
  # every DAL->Europe query is a guaranteed zero. It was in an earlier
  # version and burned about two-thirds of each run's request budget on
  # routes that cannot exist.
  #
  # Cheap one-hour hops / short drives you'd tolerate for a great fare.
  - code: AUS
    name: "Austin"
    weight: 0.92
  - code: IAH
    name: "Houston Intercontinental"
    weight: 0.90
  - code: ORD
    name: "Chicago O'Hare"
    weight: 0.80      # only worth it if the fare is spectacular

# ---------- Where you want to go ----------
# baseline_usd = what a normal-but-good round-trip economy fare costs from DFW,
# ALL-IN (fare + carry-on fee). The bot uses this only until it has collected
# its own price history, after which real observations take over.
# RECALIBRATED 2026-09-19 from a real Google Travel Explore sweep of DFW ->
# all of Europe (two searches, ~48 destinations each, covering Oct'26-Feb'27).
# Every baseline marked "observed" is that route's CHEAPEST fare anywhere in
# that window, multiplied by 1.12 to represent a normal-but-good fare rather
# than the floor. The ones marked ESTIMATE were not returned by Explore.
#
# Why this mattered: the previous numbers were guesses, and several were below
# the real floor -- Reykjavik was set to $520 against a true floor of $728, so
# it could never have produced an alert no matter how good the fare got.
#
# Caveat: Explore reports the fare only. The bot adds carry-on fees to fares it
# finds, so a found price is compared slightly unfavourably against these. That
# errs toward silence rather than false alarms, and the bot's own price history
# supersedes these numbers within a few weeks anyway.
destinations:
  - code: ARN
    city: "Stockholm"
    country: "Sweden"
    priority: 2.00          # <-- your stated #1. Scores get multiplied by this.
    baseline_usd: 635       # floor $567 x1.12 (observed 2026-09-19)
  - code: GOT
    city: "Gothenburg"
    country: "Sweden"
    priority: 1.35
    baseline_usd: 715       # ESTIMATE -- est. from ARN 567 + typical Gothenburg premium
  - code: CPH
    city: "Copenhagen"
    country: "Denmark"
    priority: 1.30          # 5h train / 35min flight to Stockholm
    baseline_usd: 675       # floor $601 x1.12 (observed 2026-09-19)
  - code: OSL
    city: "Oslo"
